name: Final build validation (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - run: npm install -g uglify-js
      - run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Smoke-check output
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/publications/synlogic/index.html
          grep -Fq "Junteng Liu" _site/index.html
          grep -Fq "jliugi@connect.ust.hk" _site/index.html
          grep -Fq "SynLogic" _site/index.html
          grep -Fq "C-Eval" _site/publications/index.html
          grep -Fq "arXiv Papers" _site/publications/index.html
          grep -Fq "Natural Language Processing" _site/index.html
          ! grep -Fq "Paper Title Number" _site/publications/index.html
          echo "Final build smoke check passed."
